name: Validate firmware catalog

on:
  pull_request:
    paths:
      - "firmware/**"
      - "tools/firmware/**"
      - ".github/workflows/firmware-catalog.yml"
  push:
    branches: [main]
    paths:
      - "firmware/**"
      - "tools/firmware/**"
      - ".github/workflows/firmware-catalog.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate catalogs and artifacts
        run: python3 tools/firmware/validate_catalog.py
